[project]
name = "streaming-arli"
version = "0.1.0"
description = "Paper-based ARLI reconstruction on ALOHA Transfer Cube + denoising-step steering pilot"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
